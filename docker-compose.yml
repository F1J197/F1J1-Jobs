version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fijijobs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fijijobs
      POSTGRES_PASSWORD: fijijobs_dev_password
      POSTGRES_DB: fiji_jobs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fijijobs"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
